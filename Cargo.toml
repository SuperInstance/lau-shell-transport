[package]
name = "lau-shell-transport"
version = "0.1.1"
edition = "2021"
description = "Transport layer for inter-shell communication — message passing via files, stdio, and memory"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-shell-transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
